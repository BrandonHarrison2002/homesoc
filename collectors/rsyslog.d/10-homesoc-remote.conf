# /etc/rsyslog.d/10-homesoc-remote.conf
# HomeSOC - accept remote syslog over UDP and write to /var/log/remote/<hostname>.log
#
# This file is version-controlled in the HomeSOC repo at:
#   collectors/rsyslog.d/10-homesoc-remote.conf
# Changes here should be mirrored to the repo and committed.

# Load the UDP input module and listen on port 514
module(load="imudp")
input(type="imudp" port="514")

# Template: route each sender to its own file by hostname
template(name="RemoteByHost"
         type="string"
         string="/var/log/remote/%HOSTNAME%.log")

# Send messages from non-loopback senders to the per-host file, then stop
# (so they don't also flow into the Pi's default log files)
if $fromhost-ip != "127.0.0.1" then {
    action(type="omfile"
           dynaFile="RemoteByHost"
           fileCreateMode="0640"
           dirCreateMode="0755"
           fileOwner="root"
           fileGroup="adm")
    stop
}
