<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HomeSOC — {% block title %}{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; background: #0f1115; color: #e6e6e6; }
    h1 { font-weight: 600; }
    h2 { font-weight: 500; font-size: 1.05rem; color: #9aa0aa; margin-top: 2rem; text-transform: uppercase; letter-spacing: 0.03em; }
    nav { margin-bottom: 1.5rem; }
    nav a { color: #58a6ff; text-decoration: none; margin-right: 1.25rem; font-size: 0.95rem; }
    nav a:hover { text-decoration: underline; }
    nav a.active { border-bottom: 2px solid #58a6ff; padding-bottom: 2px; }
    .stats { display: flex; gap: 1.5rem; flex-wrap: wrap; margin: 1rem 0 2rem; }
    .stat { background: #1a1d24; border: 1px solid #2a2e38; border-radius: 8px; padding: 0.75rem 1.25rem; min-width: 110px; }
    .stat .num { font-size: 1.75rem; font-weight: 600; }
    .stat .label { font-size: 0.8rem; color: #9aa0aa; text-transform: uppercase; letter-spacing: 0.03em; }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; padding: 0.5rem 0.75rem; border-bottom: 1px solid #2a2e38; font-size: 0.9rem; }
    th { color: #9aa0aa; font-weight: 500; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.03em; }
    .health-healthy { color: #3fb950; }
    .health-warning, .health-pending { color: #d29922; }
    .health-failure { color: #ff7b72; }
    .health-unknown { color: #9aa0aa; }
    .health-running { color: #58a6ff; }
    .health-table { overflow-x: auto; }
    .health-card { background: #1a1d24; border: 1px solid #2a2e38; border-radius: 8px; padding: 1rem; margin: 1rem 0; }
    .health-card h2 { margin-top: 0; }
    .online { color: #3fb950; }
    .offline { color: #f85149; }
    .muted { color: #6e7681; }
    .empty { color: #6e7681; font-style: italic; margin-top: 2rem; }
    .status-open { color: #ff7b72; font-weight: 600; }
    .status-resolved { color: #3fb950; }
    .badge-new { background: #5a1d1d; color: #ff7b72; padding: 1px 8px; border-radius: 10px; font-size: 0.75rem; }
    .device-filters { display: flex; gap: 1rem; flex-wrap: wrap; align-items: end; margin: 1rem 0; }
    .device-filters label { display: flex; flex-direction: column; gap: 0.4rem; font-size: 0.85rem; }
    .device-filters input, .device-filters select, .device-filters button { font: inherit; padding: 0.5rem; border: 1px solid #2a2e38; border-radius: 5px; background: #1a1d24; color: #e6e6e6; }
    .device-filters input { width: min(320px, 75vw); }
    .device-filters button { cursor: pointer; }
    .device-filters a { color: #58a6ff; padding: 0.5rem 0; }
    .device-link { color: #58a6ff; text-decoration: none; }
    .device-link:hover { text-decoration: underline; }
    .host-notes { white-space: pre-wrap; }
    .log-lines { background: #1a1d24; border: 1px solid #2a2e38; border-radius: 5px; padding: 1rem; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 0.85rem; }
    .incident-form { max-width: 760px; }
    .incident-form input[type="checkbox"] { display: inline-block; width: auto; margin: 0 0.4rem 0 0; vertical-align: middle; }
    .incident-form label { display: block; margin: 1rem 0; }
    .incident-form input, .incident-form select, .incident-form textarea { display: block; box-sizing: border-box; width: 100%; font: inherit; padding: 0.5rem; margin-top: 0.4rem; border: 1px solid #2a2e38; border-radius: 5px; background: #1a1d24; color: #e6e6e6; }
    button, .button { display: inline-block; font: inherit; padding: 0.5rem 1rem; border: 1px solid #2a2e38; border-radius: 5px; background: #1a1d24; color: #e6e6e6; cursor: pointer; text-decoration: none; }
    button:hover, .button:hover { background: #2a2e38; }
    button:focus-visible, .button:focus-visible { outline: 2px solid #58a6ff; outline-offset: 2px; }
    .form-error { color: #ff7b72; }
    .sev-low { color: #d29922; }
    .sev-medium { color: #ff7b72; }
    .sev-high { color: #ff7b72; font-weight: 700; }
    .markdown-preview { box-sizing: border-box; max-width: 100%; background: #1a1d24; border: 1px solid #2a2e38; border-radius: 5px; padding: 1.25rem; line-height: 1.6; overflow-wrap: anywhere; }
    .markdown-preview > :first-child { margin-top: 0; }
    .markdown-preview > :last-child { margin-bottom: 0; }
    .markdown-preview h1, .markdown-preview h2, .markdown-preview h3 { color: #e6e6e6; text-transform: none; letter-spacing: normal; line-height: 1.3; }
    .markdown-preview h1 { font-size: 1.4rem; }
    .markdown-preview h2 { font-size: 1.15rem; margin-top: 1.5rem; }
    .markdown-preview h3 { font-size: 1rem; }
    .markdown-preview a { color: #58a6ff; }
    .markdown-preview pre { overflow-x: auto; background: #0f1115; border: 1px solid #2a2e38; border-radius: 5px; padding: 0.75rem; white-space: pre; }
    .markdown-preview code { font-size: 0.9em; background: #0f1115; padding: 0.1rem 0.25rem; border-radius: 3px; }
    .markdown-preview pre code { padding: 0; }
    .markdown-preview table { display: block; overflow-x: auto; margin: 1rem 0; }
    .markdown-preview th { color: #9aa0aa; }
    .markdown-preview ul, .markdown-preview ol { padding-left: 1.5rem; }
    .markdown-preview blockquote { margin-left: 0; border-left: 3px solid #58a6ff; padding-left: 1rem; color: #9aa0aa; }
    .raw-source { margin: 1rem 0; }
    .raw-source summary { color: #58a6ff; cursor: pointer; }
  </style>
</head>
<body>
  <h1>HomeSOC — {% block heading %}{% endblock %}</h1>

  {% if dashboard_user %}
  <p class="muted">Signed in as {{ dashboard_user }}.</p>
    <form method="post" action="{{ url_for('logout') }}">
      <input type="hidden" name="csrf_token" value="{{ logout_token }}">
      <button type="submit">Log out</button>
    </form>
  <nav>
    <a href="/"{% if active == 'devices' %} class="active"{% endif %}>Devices</a>
    <a href="/alerts"{% if active == 'alerts' %} class="active"{% endif %}>Alerts</a>
    <a href="/logs"{% if active == 'logs' %} class="active"{% endif %}>Recent Logs</a>
    <a href="/incidents"{% if active == 'incidents' %} class="active"{% endif %}>Incidents</a>
    <a href="/health"{% if active == 'health' %} class="active"{% endif %}>Service Health</a>
    <a href="/summary"{% if active == 'summary' %} class="active"{% endif %}>Summary</a>
  </nav>

  {% endif %}

  {% block content %}{% endblock %}
</body>
</html>
